<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#FFB547"/>
      <stop offset="0.5" stop-color="#FF6A55"/>
      <stop offset="1" stop-color="#E8336D"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.25"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#7A1030" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)"/>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#sheen)"/>
  <g filter="url(#shadow)">
    <!-- A legs rising from the envelope -->
    <path d="M330 470 L512 222 L694 470" fill="none" stroke="#FFFFFF" stroke-width="78" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- envelope (its top edge is the A's crossbar) -->
    <rect x="252" y="452" width="520" height="330" rx="58" fill="#FFFFFF"/>
    <path d="M300 500 L512 650 L724 500" fill="none" stroke="#FF6A55" stroke-width="34" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
