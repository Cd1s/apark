name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # Optional: bake OAuth clients into release binaries (repo secrets).
  APARK_GOOGLE_CLIENT_ID: ${{ secrets.APARK_GOOGLE_CLIENT_ID }}
  APARK_GOOGLE_CLIENT_SECRET: ${{ secrets.APARK_GOOGLE_CLIENT_SECRET }}
  APARK_MS_CLIENT_ID: ${{ secrets.APARK_MS_CLIENT_ID }}

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test

  # macOS: SwiftUI app (universal arm64 + x86_64), Rust core linked statically.
  macos:
    needs: test
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          key: macos-universal
      - name: Build Rust core and CLI
        env:
          MACOSX_DEPLOYMENT_TARGET: "13.0"
        run: |
          for t in aarch64-apple-darwin x86_64-apple-darwin; do
            cargo build --release --locked --target $t -p apark-ffi -p apark-cli
          done
          mkdir -p apps/macos/lib
          lipo -create target/{aarch64,x86_64}-apple-darwin/release/libapark_ffi.a -output apps/macos/lib/libapark_ffi.a
          lipo -create target/{aarch64,x86_64}-apple-darwin/release/apark -output target/apark
      - name: Build SwiftUI app
        run: cd apps/macos && swift build -c release --arch arm64 --arch x86_64
      - name: Bundle
        run: packaging/macos-bundle.sh apps/macos/.build/apple/Products/Release/Apark target/apark
      - name: Screenshots
        run: |
          run() { perl -e 'alarm shift; exec @ARGV' "$@" || true; }
          export APARK_NO_SYNC=1
          APARK_HOME="$RUNNER_TEMP/demo" target/apark dev-seed
          APARK_HOME="$RUNNER_TEMP/demo" APARK_SNAPSHOT="$PWD/shots" run 60 dist/Apark.app/Contents/MacOS/Apark
          APARK_HOME="$RUNNER_TEMP/empty" APARK_SNAPSHOT="$PWD/shots/welcome" run 40 dist/Apark.app/Contents/MacOS/Apark
          dist/Apark.app/Contents/MacOS/Apark --version
          find shots -type f
      - uses: actions/upload-artifact@v4
        with:
          name: apark-macos-universal
          path: |
            dist/*.zip
            dist/*.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: screenshots-macos
          path: shots

  # Windows: WinUI 3 app (unpackaged, self-contained), Rust core as apark_ffi.dll.
  windows:
    needs: test
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64, target: x86_64-pc-windows-msvc, rid: win-x64 }
          - { arch: arm64, target: aarch64-pc-windows-msvc, rid: win-arm64 }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build Rust core and CLI
        run: cargo build --release --locked --target ${{ matrix.target }} -p apark-ffi -p apark-cli
      - name: Build WinUI app
        run: dotnet publish apps/windows/Apark.csproj -c Release -r ${{ matrix.rid }} -p:Platform=${{ matrix.arch == 'x64' && 'x64' || 'ARM64' }} -o dist/Apark
      - name: Assemble
        shell: bash
        run: |
          t=target/${{ matrix.target }}/release
          cp $t/apark_ffi.dll dist/Apark/
          cp $t/apark.exe dist/Apark/apark-cli.exe
          (cd dist && 7z a -tzip Apark-windows-${{ matrix.arch }}.zip Apark >/dev/null)
          (cd $t && 7z a -tzip "$GITHUB_WORKSPACE/dist/apark-cli-windows-${{ matrix.arch }}.zip" apark.exe >/dev/null)
          ls -la dist
      - name: Screenshots
        if: matrix.arch == 'x64'
        shell: pwsh
        run: |
          $env:APARK_NO_SYNC = "1"
          $env:APARK_HOME = "$env:RUNNER_TEMP\demo"
          dist\Apark\apark-cli.exe dev-seed
          $env:APARK_SNAPSHOT = "$pwd\shots"
          $p = Start-Process dist\Apark\Apark.exe -PassThru
          if (-not $p.WaitForExit(90000)) { $p.Kill() }
          dist\Apark\Apark.exe --version
          Get-ChildItem shots -ErrorAction SilentlyContinue
      - uses: actions/upload-artifact@v4
        with:
          name: apark-windows-${{ matrix.arch }}
          path: |
            dist/*.zip
      - uses: actions/upload-artifact@v4
        if: matrix.arch == 'x64'
        with:
          name: screenshots-windows
          path: shots
          if-no-files-found: ignore

  # Linux: GTK4 + libadwaita app, built natively per architecture.
  linux:
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, arch: x64 }
          - { os: ubuntu-24.04-arm, arch: arm64 }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: linux-${{ matrix.arch }}
      - run: sudo apt-get update -q && sudo apt-get install -yq libgtk-4-dev libadwaita-1-dev xvfb fonts-noto-cjk
      - run: cargo build --release --locked -p apark-gtk -p apark-cli
      - name: Package
        run: |
          mkdir -p dist/Apark
          cp target/release/apark-desktop target/release/apark packaging/apark.desktop dist/Apark/
          cp assets/icon-256.png dist/Apark/apark.png
          tar -C dist -czf dist/Apark-linux-${{ matrix.arch }}.tar.gz Apark
          tar -C target/release -czf dist/apark-cli-linux-${{ matrix.arch }}.tar.gz apark
      - name: Screenshots
        if: matrix.arch == 'x64'
        run: |
          export APARK_NO_SYNC=1 GSK_RENDERER=cairo
          APARK_HOME=$RUNNER_TEMP/demo target/release/apark dev-seed
          APARK_HOME=$RUNNER_TEMP/demo APARK_SNAPSHOT=$PWD/shots timeout 60 xvfb-run -a -s "-screen 0 1300x820x24" target/release/apark-desktop || true
          APARK_HOME=$RUNNER_TEMP/empty APARK_SNAPSHOT=$PWD/shots/welcome timeout 60 xvfb-run -a -s "-screen 0 1300x820x24" target/release/apark-desktop || true
          find shots -type f
      - uses: actions/upload-artifact@v4
        with:
          name: apark-linux-${{ matrix.arch }}
          path: dist/*.tar.gz
      - uses: actions/upload-artifact@v4
        if: matrix.arch == 'x64'
        with:
          name: screenshots-linux
          path: shots
          if-no-files-found: ignore

  # Headless CLI as a fully static binary for any Linux server.
  cli-static:
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - { os: ubuntu-24.04, target: x86_64-unknown-linux-musl, arch: x64 }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl, arch: arm64 }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: sudo apt-get update -q && sudo apt-get install -yq musl-tools
      - run: cargo build --release --locked --target ${{ matrix.target }} -p apark-cli
      - run: |
          mkdir -p dist
          tar -C target/${{ matrix.target }}/release -czf dist/apark-cli-linux-${{ matrix.arch }}-static.tar.gz apark
      - uses: actions/upload-artifact@v4
        with:
          name: apark-linux-${{ matrix.arch }}-static
          path: dist/*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, windows, linux, cli-static]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: apark-*
          merge-multiple: true
      - run: cd dist && sha256sum * > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
