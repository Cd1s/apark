name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # Optional: bake OAuth clients into release binaries (repo secrets).
  APARK_GOOGLE_CLIENT_ID: ${{ secrets.APARK_GOOGLE_CLIENT_ID }}
  APARK_GOOGLE_CLIENT_SECRET: ${{ secrets.APARK_GOOGLE_CLIENT_SECRET }}
  APARK_MS_CLIENT_ID: ${{ secrets.APARK_MS_CLIENT_ID }}

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  build:
    name: ${{ matrix.label }}
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-14, target: aarch64-apple-darwin, label: macos-arm64 }
          - { os: macos-14, target: x86_64-apple-darwin, label: macos-x64 }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, label: windows-x64 }
          - { os: windows-latest, target: aarch64-pc-windows-msvc, label: windows-arm64 }
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, label: linux-x64 }
          - { os: ubuntu-22.04, target: aarch64-unknown-linux-gnu, label: linux-arm64 }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Linux arm64 cross toolchain
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update -q && sudo apt-get install -yq gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
          echo "CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
      - name: Build
        shell: bash
        run: cargo build --release --locked --target ${{ matrix.target }} -p apark-cli -p apark-desktop
      - name: Package
        shell: bash
        run: packaging/package.sh ${{ matrix.target }} ${{ matrix.label }}
      - uses: actions/upload-artifact@v4
        with:
          name: apark-${{ matrix.label }}
          path: dist/*

  # Headless CLI as a fully static binary for any Linux server.
  cli-musl:
    needs: test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
        with:
          key: musl
      - run: sudo apt-get update -q && sudo apt-get install -yq musl-tools
      - run: cargo build --release --locked --target x86_64-unknown-linux-musl -p apark-cli
      - run: |
          mkdir -p dist
          tar -C target/x86_64-unknown-linux-musl/release -czf dist/apark-cli-linux-x64-static.tar.gz apark
      - uses: actions/upload-artifact@v4
        with:
          name: apark-linux-x64-static
          path: dist/*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, cli-musl]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: cd dist && sha256sum * > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
