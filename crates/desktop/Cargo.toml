[package]
name = "apark-desktop"
description = "Apark desktop app (macOS / Windows / Linux); also accepts every CLI command"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "apark-desktop"
path = "src/main.rs"

[dependencies]
apark-core.workspace = true
apark-cli.workspace = true
anyhow.workspace = true
tokio.workspace = true
chrono.workspace = true
eframe = "0.36"
dirs = "6"
webbrowser = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Console"] }
