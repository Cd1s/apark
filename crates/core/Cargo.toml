[package]
name = "apark-core"
description = "Apark mail engine: accounts, OAuth, IMAP sync, SMTP, local store, cloud account sync"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
chrono.workspace = true
async-imap = { version = "0.12", default-features = false, features = ["runtime-tokio"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging", "tls12"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"
futures = "0.3"
mail-parser = "0.11"
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1", "tokio1-rustls", "ring", "webpki-roots", "hostname"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.32", features = ["bundled"] }
dirs = "6"
base64 = "0.22"
sha2 = "0.10"
rand = "0.8"
chacha20poly1305 = "0.10"
argon2 = "0.5"
url = "2"
webbrowser = "1"
